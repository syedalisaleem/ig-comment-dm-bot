name: IG Comment DM Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (once)
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: python bot.py --once

      - name: Commit bot state
        run: |
          git config user.name "igbot"
          git config user.email "igbot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "State unchanged"
          else
            git commit -m "Update bot state [skip ci]"
            git push
          fi
