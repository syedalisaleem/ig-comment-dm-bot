name: IG Comment DM Bot

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: igbot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (once)
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: python bot.py --once

      - name: Commit state
        run: |
          git config user.name "igbot"
          git config user.email "igbot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "Update bot state"
          git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
          git push origin main || true

      - name: Schedule next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run igbot.yml --repo "$GITHUB_REPOSITORY" --ref main
