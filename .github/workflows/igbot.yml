name: IG Comment DM Bot

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: igbot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (once)
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: python bot.py --once

      - name: Commit state and heartbeat
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "igbot"
          git config user.email "igbot@users.noreply.github.com"
          date +%s > heartbeat.txt
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "bot run"
          PUSH_URL="origin"
          if [ -n "$GH_PAT" ]; then
            PUSH_URL="https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main 2>/dev/null || git rebase --abort 2>/dev/null || true
            if git push "$PUSH_URL" main; then
              echo "Pushed (attempt $attempt)"
              exit 0
            fi
            sleep 10
          done
          echo "Push failed after 3 attempts - will retry next run"
          exit 0
